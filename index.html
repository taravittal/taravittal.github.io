<!DOCTYPE html>
<html lang="en">
<head>

            max-width: 800px;
            margin: 60px auto;

            padding: 40px;

            margin-bottom: 5px;

        }

        }

            font-size: 18px;
            line-height: 1.6;
        }

        img {
            margin-top: 20px;
            width: 300px;
            border-radius: 10px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 30px;
        }

        li {
            margin: 10px 0;
        }

        a {
            text-decoration: none;
            color: #007acc;
